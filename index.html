<style>

  --ink:#161616; --bg:#F7C6D4; --paper:#fff;

  --shadow:5px 5px 0 var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{
  font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg);

  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ---------- títulos estilo "sticker" ---------- */
.title,.logo,.note,.group-t{
  font-family:'Luckiest Guy',cursive;color:#fff;letter-spacing:.03em;
  -webkit-text-stroke:var(--sw,2.5px) var(--ink);paint-order:stroke fill;
  text-shadow:var(--ts,3px 4px 0) var(--ink);line-height:1;
}
.title{font-size:clamp(2rem,5.5vw,2.6rem);text-transform:uppercase}
.note{--sw:1.4px;--ts:2px 2px 0;font-size:.95rem;text-transform:uppercase}

/* ---------- hero ---------- */
.hero{position:relative;padding:28px 0 22px;text-align:center}
.hero-in{display:flex;align-items:center;justify-content:center;gap:clamp(8px,4vw,40px)}
.logo{--sw:4px;--ts:6px 7px 0;font-size:clamp(4.2rem,16vw,8.5rem);transform:rotate(-3deg);display:inline-block}
.tagline{margin-top:14px;font-weight:900;font-size:1rem;letter-spacing:.02em}
.hero .mascot{width:clamp(96px,22vw,170px);flex:none;animation:bob 3.2s ease-in-out infinite}
.hero .bubble{position:absolute;top:10px;right:max(0px,calc(50% - 400px));transform:rotate(4deg)}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 14px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);font-weight:900;font-size:.9rem;box-shadow:3px 3px 0 var(--ink)}
.status i{width:10px;height:10px;border-radius:50%;background:#20b25a;box-shadow:0 0 0 3px rgba(32,178,90,.25)}
.status.off i{background:var(--r);box-shadow:0 0 0 3px rgba(217,52,39,.25)}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:3px solid var(--ink);border-radius:12px;background:var(--y);font-family:'Luckiest Guy';font-size:1rem;letter-spacing:.04em;text-decoration:none;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn svg{width:18px;height:18px}
.btn.g{background:var(--l)}.btn.k{background:var(--k)}.btn.c{background:var(--c)}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:20;background:var(--bg);border-block:3px solid var(--ink)}
.nav ul{display:flex;gap:8px;overflow-x:auto;list-style:none;padding:10px 16px;max-width:1180px;margin:0 auto;scrollbar-width:none;scroll-snap-type:x proximity}
.nav ul::-webkit-scrollbar{display:none}
.nav a{display:block;white-space:nowrap;padding:7px 14px 5px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);font-family:'Luckiest Guy';font-size:.92rem;letter-spacing:.04em;text-decoration:none;scroll-snap-align:center;transition:background .15s,transform .15s,box-shadow .15s}
.nav a[aria-current="true"]{background:var(--y);box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}

/* ---------- grupos y secciones ---------- */
.group{padding:34px 0 8px}
.group-t{--sw:3px;--ts:4px 5px 0;display:flex;align-items:center;gap:14px;font-size:clamp(1.6rem,4.5vw,2.2rem);margin-bottom:26px;text-transform:uppercase}
.group-t::before,.group-t::after{content:"";flex:1;height:3px;background:repeating-linear-gradient(90deg,var(--ink) 0 10px,transparent 10px 18px)}
.grid{columns:2 440px;column-gap:40px}
.sec{break-inside:avoid;margin-bottom:38px}
.sec-h{display:flex;align-items:flex-end;flex-wrap:wrap;gap:6px 14px;margin-bottom:12px;min-height:52px;position:relative}
.aside{margin-left:auto;display:flex;align-items:flex-end;gap:4px}
.aside .mascot{width:62px;flex:none}
.bubble{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:9px 13px 7px;max-width:180px;font-family:'Luckiest Guy';font-size:.82rem;line-height:1.1;letter-spacing:.03em;text-align:center;text-transform:uppercase;box-shadow:3px 3px 0 var(--ink)}
.bubble::after{content:"";position:absolute;right:-11px;bottom:12px;width:14px;height:14px;background:var(--paper);border:3px solid var(--ink);border-left:0;border-bottom:0;transform:rotate(45deg) skew(10deg,10deg)}
.hero .bubble::after{right:auto;left:18px;bottom:-10px;transform:rotate(135deg)}

/* ---------- tablero de items ---------- */
.board{list-style:none;border:3px solid var(--ink);border-radius:6px;overflow:hidden;box-shadow:var(--shadow);background:var(--paper)}
.board+.board{margin-top:18px}
.row{--fg:var(--ink);display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:10px 14px;background:var(--bg-row);color:var(--fg)}
.row+.row{border-top:3px solid var(--ink)}
.row.y{--bg-row:var(--y)}.row.k{--bg-row:var(--k)}.row.c{--bg-row:var(--c)}.row.o{--bg-row:var(--o)}.row.l{--bg-row:var(--l)}
.row.p{--bg-row:var(--p);--fg:#fff}.row.r{--bg-row:var(--r);--fg:#fff}
.row h3{font-family:'Luckiest Guy';font-weight:400;font-size:1.08rem;letter-spacing:.035em;line-height:1.1;text-transform:uppercase;padding-top:2px}
.row h3 em{font-family:Nunito;font-style:normal;font-weight:800;font-size:.68rem;letter-spacing:0;text-transform:none;opacity:.85}
.row p{font-weight:700;font-size:.8rem;line-height:1.3;margin-top:2px;opacity:.92;max-width:44ch}
.tag{display:inline-block;margin-left:6px;padding:2px 7px 0;border:2px solid var(--ink);border-radius:999px;background:var(--paper);color:var(--ink);font-size:.62rem;vertical-align:middle;transform:rotate(-4deg)}
.prices{display:flex;gap:14px;text-align:center}
.pr{font-family:'Permanent Marker',cursive;font-size:1.3rem;line-height:1;white-space:nowrap}
.pr small{display:block;font-family:Nunito;font-weight:900;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;opacity:.8}
.pr.ask{font-size:.95rem;opacity:.85}
.foot{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--l);border-top:3px solid var(--ink);font-weight:900;font-size:.82rem}
.foot svg{width:18px;height:18px;flex:none}
.deco{position:absolute;pointer-events:none}

/* ---------- sucursales ---------- */
.branches{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.branch{background:#FFF6DA;border:3px solid var(--ink);border-radius:10px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.branch h3{align-self:flex-start;font-family:'Luckiest Guy';font-weight:400;font-size:1.15rem;letter-spacing:.04em;padding:5px 12px 2px;border:3px solid var(--ink);border-radius:8px;background:var(--bg-row);color:var(--fg,var(--ink));transform:rotate(-2deg);text-transform:uppercase}
.branch p{font-weight:800;font-size:.9rem;line-height:1.35}
.branch small{font-weight:700;font-size:.78rem;opacity:.75}
.branch .links{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.branch .links a{flex:1;justify-content:center;font-size:.85rem;padding:8px 10px}

/* ---------- info ---------- */
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;padding:36px 0 120px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:18px;box-shadow:var(--shadow);font-weight:800}
.card dt{font-family:'Luckiest Guy';letter-spacing:.04em;font-size:1rem}
.card dd{margin:0 0 10px}
.wifi-key{font-family:'Permanent Marker';font-size:1.6rem;line-height:1.2}
.foot-brand{display:flex;align-items:center;justify-content:center;gap:12px;text-align:center}
.foot-brand .logo{font-size:3.4rem;--sw:3px;--ts:4px 5px 0}

/* ---------- FAB + toast ---------- */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;background:#25D366}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;z-index:40;padding:10px 18px 8px;background:var(--ink);color:#fff;border-radius:999px;font-family:'Luckiest Guy';letter-spacing:.04em;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
@media (max-width:640px){
  .hero .bubble{position:static;display:inline-block;margin-bottom:6px}
  .hero .bubble::after{display:none}
  .row{padding:10px 12px}
  .prices{gap:10px}.pr{font-size:1.12rem}
  .aside .mascot{width:52px}.bubble{font-size:.74rem;max-width:150px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>

 {n: 'Nueva Cba', col: 'k', a: 'Fructuoso Rivera 15', h: 'Todos los días de 12 a 15 y de 20 a 00hs', tel: '351-7050009'},
 {n: 'Tejeda', col: 'l', a: 'Tejeda 4289', h: 'Todos los días de 12 a 00hs', tel: '351-8626600'},
 {n: 'Monseñor', col: 'o', a: 'Mons. Pablo Cabrera 3141', h: 'Todos los días de 12 a 15 y de 20 a 00hs', tel: '351-7066892'},
 {n: 'Gral. Paz', col: 'p', a: 'Esquiú 432', h: 'Todos los días de 12 a 15 y de 20 a 00hs', tel: '351-9077777'},
 {n: 'Alberdi', col: 'c', a: 'Nicolás Avellaneda 314', h: 'Todos los días de 12 a 15 y de 20 a 00hs', tel: '351-2102063'},
 {n: 'Manantiales II', col: 'k', a: 'Prados de Manantiales, local 6', h: 'Todos los días de 12 a 15 y de 20 a 00hs', tel: '351-6546931'},
];

// ---------- personajes (SVG propios inspirados en la carta) ----------
const MASCOTS = {
 blue: `<g stroke="#161616" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
   <path d="M18 160c0-34 22-52 52-52s52 18 52 52z" fill="#3D7BF0"/>
   <path d="M50 112c6 12 34 12 40 0" fill="none"/>
   <circle cx="70" cy="76" r="34" fill="#5B97F8"/>
   <path d="M30 54c2-26 18-40 40-40s38 14 40 40z" fill="#2F6BE0"/>
   <path d="M14 56c12-8 100-8 112 0-8 10-104 10-112 0z" fill="#3D7BF0"/>
   <rect x="43" y="68" width="24" height="15" rx="6" fill="#161616"/><rect x="73" y="68" width="24" height="15" rx="6" fill="#161616"/>
   <path d="M67 74h6M56 98c9 6 19 6 28-1" fill="none"/>
   <rect x="98" y="114" width="24" height="36" rx="5" fill="#161616"/><circle cx="100" cy="134" r="9" fill="#5B97F8"/>
 </g>
 <path d="M64 32h7a5 5 0 0 1 0 10h-7zm0 10 9 8" fill="none" stroke="#161616" stroke-width="3.5" stroke-linecap="round"/>
 <path d="M48 72l6-3" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>`,
 red: `<g stroke="#161616" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
   <path d="M18 160c0-34 22-52 52-52s52 18 52 52z" fill="#EF4B3F"/>
   <circle cx="70" cy="76" r="33" fill="#FCD9C4"/>
   <path d="M38 80c0 26 14 40 32 40s32-14 32-40c-8 8-20 10-32 10s-24-2-32-10z" fill="#E2462F"/>
   <path d="M60 96c6 4 14 4 20 0" fill="none"/>
   <path d="M36 62c0-24 15-38 34-38s34 14 34 38z" fill="#EF4B3F"/>
   <path d="M98 60c10 0 22 3 26 8-10 3-22 2-30-1z" fill="#EF4B3F"/>
   <rect x="42" y="66" width="24" height="14" rx="6" fill="#161616"/><rect x="74" y="66" width="24" height="14" rx="6" fill="#161616"/>
   <path d="M66 72h8" fill="none"/>
 </g>
 <text x="70" y="52" text-anchor="middle" font-family="Luckiest Guy" font-size="11" fill="#fff" letter-spacing=".5">RICASO</text>`,
};
const RAINBOW = `<svg class="deco" viewBox="0 0 120 64" style="width:96px;right:6px;top:-8px" aria-hidden="true"><g fill="none" stroke-width="9" stroke-linecap="round">
 <path d="M14 60a46 46 0 0 1 92 0" stroke="#EF4B3F"/><path d="M24 60a36 36 0 0 1 72 0" stroke="#FFD23F"/><path d="M34 60a26 26 0 0 1 52 0" stroke="#B8E04A"/><path d="M44 60a16 16 0 0 1 32 0" stroke="#5BC8EC"/></g></svg>`;

// ---------- render ----------
const money = n => n == null ? 'consultar' : '$ ' + n.toLocaleString('es-AR');
const price = (v, label) => `<span class="pr${v == null ? ' ask' : ''}">${label ? `<small>${label}</small>` : ''}${money(v)}</span>`;
const mascot = m => `<svg class="mascot" viewBox="0 0 140 160" aria-hidden="true">${MASCOTS[m]}</svg>`;

const row = (it, col) => `<li class="row ${col}">
  <div><h3>${it.n}${it.u ? ` <em>${it.u}</em>` : ''}${it.tag ? `<span class="tag">${it.tag}</span>` : ''}</h3>${it.d ? `<p>${it.d}</p>` : ''}</div>
  <div class="prices">${it.p && typeof it.p === 'object' ? Object.entries(it.p).map(([k, v]) => price(v, k)).join('') : price(it.p)}</div>
</li>`;

const section = s => `<section class="sec" id="${s.id}" aria-labelledby="${s.id}-t">
  <header class="sec-h">
    <div><h2 class="title" id="${s.id}-t">${s.t}</h2>${s.note ? `<div class="note" style="margin-top:6px">${s.note}</div>` : ''}</div>
    ${s.bubble ? `<div class="aside"><div class="bubble">${s.bubble}</div>${mascot(s.m)}</div>` : ''}
    ${s.deco ? RAINBOW : ''}
  </header>
  ${s.boards.map(b => `<ul class="board">${b.items.map((it, i) => row(it, b.pal[i % b.pal.length])).join('')}${b.foot ? `<li class="foot">${LEAF}${b.foot}</li>` : ''}</ul>`).join('')}
</section>`;

document.getElementById('menu').innerHTML = GROUPS.map(g =>
  `<div class="group"><h2 class="group-t">${g.t}</h2><div class="grid">${g.secs.map(section).join('')}</div></div>`).join('');

const allSecs = GROUPS.flatMap(g => g.secs);
document.getElementById('nav').innerHTML = allSecs.map(s => `<li><a href="#${s.id}">${s.nav || s.t}</a></li>`).join('')
  + '<li><a href="#sucursales">Sucursales</a></li>';

document.getElementById('branches').innerHTML = BRANCHES.map(b => {
  const wa = '549' + b.tel.replace(/\D/g, '');
  const map = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(b.a + ', Córdoba, Argentina');
  return `<article class="branch" style="--bg-row:var(--${b.col})${b.col === 'p' ? ';--fg:#fff' : ''}">
    <h3>${b.n}</h3><p>${b.a}</p><p>${b.h}</p><small>Delivery propio, PedidosYa, take away y salón</small>
    <div class="links"><a class="btn g" href="https://wa.me/${wa}" target="_blank" rel="noopener">${b.tel}</a><a class="btn" href="${map}" target="_blank" rel="noopener">Cómo llegar</a></div>
  </article>`;
}).join('');

document.querySelectorAll('svg[data-m]').forEach(el => { el.setAttribute('viewBox', '0 0 140 160'); el.innerHTML = MASCOTS[el.dataset.m]; });

// ---------- abierto / cerrado (hora de Córdoba, horario general 12 a 00hs) ----------
const h = +new Intl.DateTimeFormat('en-US', {timeZone: 'America/Argentina/Cordoba', hour: 'numeric', hourCycle: 'h23'}).format(new Date());
const st = document.getElementById('status'), open = h >= 12;
st.classList.toggle('off', !open);
st.querySelector('span').textContent = open ? 'Abierto ahora · hasta las 00hs' : 'Cerrado · abrimos a las 12hs';

// ---------- scroll-spy ----------
const navUl = document.getElementById('nav'), links = [...navUl.querySelectorAll('a')];
let current;
const spy = new IntersectionObserver(es => es.forEach(e => {
  const a = links.find(l => l.hash === '#' + e.target.id);
  if (!e.isIntersecting || a === current) return;
  current?.removeAttribute('aria-current');
  a.setAttribute('aria-current', 'true');
  current = a;
  // solo mueve la barra de chips: scrollIntoView también tocaba el scroll de la página y lo trababa
  navUl.scrollTo({left: a.offsetLeft - (navUl.clientWidth - a.offsetWidth) / 2, behavior: 'smooth'});
}), {rootMargin: '-40% 0px -55% 0px'});
document.querySelectorAll('.sec, #sucursales').forEach(s => spy.observe(s));
// salto sin ensuciar el historial (el botón "atrás" vuelve a salir de la carta)
navUl.addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  document.querySelector(a.hash).scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
});

// ---------- copiar clave WiFi ----------
const toast = document.getElementById('toast');
document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(b.dataset.copy); toast.textContent = '¡Clave copiada!'; }
  catch { toast.textContent = 'Clave: ' + b.dataset.copy; }
  toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1800);
}));
</script>
</body>
</html>
